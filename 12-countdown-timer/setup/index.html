<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>

    <!-- styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="section-center">
      <article class="gitf-img">
        <img src="./gift.jpeg" alt="phone" />
      </article>
      <article class="gift-info">
        <h3>Celular antigo</h3>
        <h4 class="giveaway">ends on 777</h4>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Obcaecati
          pariatur voluptatum officia sapiente impedit accusantium quibusdam
          neque iure enim quod?
        </p>
        <div class="deadline">
          <div class="deadline-format">
            <div class="">
              <h4 class="days">77</h4>
              <span>days</span>
            </div>
          </div>
          <div class="deadline-format">
            <div class="">
              <h4 class="hours">77</h4>
              <span>hours</span>
            </div>
          </div>
          <div class="deadline-format">
            <div class="">
              <h4 class="mins">77</h4>
              <span>min</span>
            </div>
          </div>
          <div class="deadline-format">
            <div class="">
              <h4 class="secs">77</h4>
              <span>sec</span>
            </div>
          </div>
        </div>
      </article>
    </section>
    <!-- javascript -->
    <script src="app.js"></script>
  </body>
</html>
